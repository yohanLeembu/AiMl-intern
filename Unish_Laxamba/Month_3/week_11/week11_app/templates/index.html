<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Digit Classifier Demo — Week 11</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    max-width: 560px;
    margin: 40px auto;
    text-align: center;
    color: #222;
  }
  h1 { font-size: 1.4rem; }
  p.sub { color: #666; margin-top: -8px; }
  canvas {
    border: 2px solid #333;
    border-radius: 8px;
    background: black;
    cursor: crosshair;
    touch-action: none;
  }
  .buttons { margin-top: 14px; }
  button {
    font-size: 1rem;
    padding: 8px 18px;
    margin: 0 6px;
    border-radius: 6px;
    border: 1px solid #ccc;
    cursor: pointer;
    background: #f5f5f5;
  }
  button.primary {
    background: #2563eb;
    color: white;
    border: none;
  }
  #result {
    margin-top: 20px;
    font-size: 1.1rem;
    min-height: 90px;
  }
  #result .big {
    font-size: 3rem;
    font-weight: bold;
    color: #2563eb;
  }
  .top3 {
    font-size: 0.9rem;
    color: #555;
    margin-top: 6px;
  }
</style>
</head>
<body>
  <h1>✍️ Handwritten Digit Classifier</h1>
  <p class="sub">Draw a digit (0–9) below, then click Predict.</p>

  <canvas id="canvas" width="280" height="280"></canvas>

  <div class="buttons">
    <button class="primary" onclick="predict()">Predict</button>
    <button onclick="clearCanvas()">Clear</button>
  </div>

  <div id="result"></div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'black';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 18;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    let drawing = false;

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
      }
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function startDraw(e) {
      drawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      e.preventDefault();
    }

    function draw(e) {
      if (!drawing) return;
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      e.preventDefault();
    }

    function stopDraw() {
      drawing = false;
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mouseleave', stopDraw);
    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDraw);

    function clearCanvas() {
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      document.getElementById('result').innerHTML = '';
    }

    async function predict() {
      const dataUrl = canvas.toDataURL('image/png');
      document.getElementById('result').innerHTML = 'Predicting...';

      const response = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: dataUrl })
      });
      const data = await response.json();

      if (data.error) {
        document.getElementById('result').innerHTML = 'Error: ' + data.error;
        return;
      }

      let top3html = data.top3.map(t =>
        `${t.digit}: ${(t.confidence * 100).toFixed(1)}%`
      ).join(' &nbsp;|&nbsp; ');

      document.getElementById('result').innerHTML =
        `<div class="big">${data.prediction}</div>` +
        `<div class="top3">Top guesses — ${top3html}</div>`;
    }
  </script>
</body>
</html>
